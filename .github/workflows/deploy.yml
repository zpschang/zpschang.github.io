name: deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # Pinned: ubuntu-latest moves to 26.04 from Oct 2026, which has no prebuilt Ruby 3.2.2.
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v5
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
    - name: Install and Build 🔧
      run: |
        npm install -g purgecss
        export JEKYLL_ENV=production
        bundle exec jekyll build
        purgecss -c purgecss.config.js
        touch _site/.nojekyll
    - name: Deploy 🚀
      if: github.event_name != 'pull_request'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: _site
        single-commit: true  # gh-pages keeps only the latest build

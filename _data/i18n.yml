    我希望与认同 Physical AGI 愿景的优秀伙伴合作，实习、全职均可。我尤其看重：

    - **前沿 AI 能力**：深入掌握前沿 LLM 与 Agent，并能将其工程化为 Agent 原生的管线，自动化物理 AI 的研究与数据流程；
    - **具身数据能力**：精通具身数据从采集、质量控制到训练的全链路，并将其构建为严谨、可复现的系统；
    - **研究深度**：在某个方向上有深入的积累，能识别通往物理 AGI 道路上的关键问题，并以严谨的实验加以验证；
    - **扎实基础**：数学功底扎实，编程能力出色。

    如果你有意愿，或者希望交流，欢迎联系我。
